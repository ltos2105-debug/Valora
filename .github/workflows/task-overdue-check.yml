name: Marcar Tarefas Atrasadas em Vermelho

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  check-overdue-tasks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verificar e Marcar Tarefas Atrasadas
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const projectNumber = 1;
            const owner = 'ltos2105-debug';
            
            const query = `
              query($owner:String!, $number:Int!) {
                user(login:$owner) {
                  projectV2(number:$number) {
                    id
                    fields(first:20) {
                      nodes {
                        ... on ProjectV2Field {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                    items(first:100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            title
                            comments {
                              totalCount
                            }
                          }
                          ... on DraftIssue {
                            title
                          }
                        }
                        fieldValueByName(name:"Data de Vencimento") {
                          ... on ProjectV2ItemFieldDateValue {
                            date
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const variables = {
              owner: owner,
              number: projectNumber
            };
            
            try {
              const result = await github.graphql(query, variables);
              const today = new Date().toISOString().split('T')[0];
              const projectId = result.user.projectV2.id;
              
              console.log('📋 ========== VERIFICAÇÃO DE TAREFAS ATRASADAS ==========');
              console.log(`📅 Data atual: ${today}`);
              console.log(`🔍 Projeto: ${projectNumber}`);
              console.log('======================================================\n');
              
              if (!result.user || !result.user.projectV2 || !result.user.projectV2.items) {
                console.log('❌ Projeto não encontrado ou vazio');
                return;
              }
              
              const fields = result.user.projectV2.fields.nodes;
              let priorityFieldId = null;
              let atrasadaOptionId = null;
              let emAndamentoOptionId = null;
              
              for (const field of fields) {
                if (field.name === 'Prioridade') {
                  priorityFieldId = field.id;
                  if (field.options) {
                    for (const option of field.options) {
                      if (option.name === 'Atrasada') {
                        atrasadaOptionId = option.id;
                      }
                      if (option.name === 'Em Andamento') {
                        emAndamentoOptionId = option.id;
                      }
                    }
                  }
                  break;
                }
              }
              
              console.log(`🔧 Campo Prioridade ID: ${priorityFieldId}`);
              console.log(`🔧 Opção Atrasada ID: ${atrasadaOptionId}`);
              console.log(`🔧 Opção Em Andamento ID: ${emAndamentoOptionId}\n`);
              
              let countOverdue = 0;
              let countUpdated = 0;
              let countWithComments = 0;
              
              for (const item of result.user.projectV2.items.nodes) {
                const title = item.content?.title || 'Sem título';
                const dueDate = item.fieldValueByName('Data de Vencimento')?.date;
                const commentCount = item.content?.comments?.totalCount || 0;
                
                if (dueDate && dueDate < today) {
                  countOverdue++;
                  console.log(`📌 Título: ${title}`);
                  console.log(`   📅 Vencimento: ${dueDate} (VENCIDA)`);
                  console.log(`   💬 Comentários: ${commentCount}`);
                  
                  if (commentCount === 0) {
                    if (priorityFieldId && atrasadaOptionId) {
                      const updated = await updateTaskPriority(projectId, item.id, priorityFieldId, atrasadaOptionId);
                      if (updated) {
                        countUpdated++;
                        console.log(`   🔴 Marcada como ATRASADA (Vermelho) ⚠️`);
                      }
                    }
                  } else {
                    countWithComments++;
                    if (priorityFieldId && emAndamentoOptionId) {
                      const updated = await updateTaskPriority(projectId, item.id, priorityFieldId, emAndamentoOptionId);
                      if (updated) {
                        console.log(`   🟢 Mantida como EM ANDAMENTO (Verde) ✅`);
                      }
                    }
                  }
                  console.log('');
                }
              }
              
              console.log('======================================================');
              console.log(`✅ RESUMO DA VERIFICAÇÃO:`);
              console.log(`   📊 Total de tarefas vencidas: ${countOverdue}`);
              console.log(`   🔴 Marcadas como ATRASADA: ${countUpdated}`);
              console.log(`   🟢 Com comentários (Em Andamento): ${countWithComments}`);
              console.log('======================================================');
              
            } catch (error) {
              console.error('❌ ERRO NA EXECUÇÃO:', error.message);
              console.error(error);
            }
            
            async function updateTaskPriority(projectId, itemId, fieldId, optionId) {
              const updateQuery = `
                mutation($input: UpdateProjectV2ItemFieldValueInput!) {
                  updateProjectV2ItemFieldValue(input: $input) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `;
              
              const input = {
                projectId: projectId,
                itemId: itemId,
                fieldId: fieldId,
                value: {
                  singleSelectOptionId: optionId
                }
              };
              
              try {
                await github.graphql(updateQuery, { input });
                return true;
              } catch (err) {
                console.log(`   ⚠️ Erro ao atualizar: ${err.message}`);
                return false;
              }
            }
