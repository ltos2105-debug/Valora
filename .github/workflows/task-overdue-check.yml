





name: Marcar Tarefas Atrasadas

on:
  schedule:
    # Executa diariamente às 9:00 AM (UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite disparar manualmente

jobs:
  check-overdue-tasks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
